version: "1.0"

# Data sources configuration — the single source of truth is awesome-repo-configs.
# Other Chat2AnyLLM repos (code-agent-manager, downstream consumers) also pull
# their data from awesome-repo-configs, so we avoid layering an extra hop here.
sources:
  - id: "awesome-repo-configs"
    url: "https://raw.githubusercontent.com/Chat2AnyLLM/awesome-repo-configs/main/plugin_repos.json"
    format: "json"
    enabled: true
    priority: 1
    timeout: 30

# Generation settings
generation:
  output_file: "README.md"
  include_marketplace_tables: true
  include_plugin_categories: true

# Logging settings
logging:
  level: "INFO"
